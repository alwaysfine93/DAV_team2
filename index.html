<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2366ea">
  <title>분실물 찾기·등록 웹앱</title>
  <style>
    * { box-sizing: border-box; }

    body {
      background: #f6f9fb;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      margin: 0;
      color: #212735;
    }

    .container {
      width: min(100% - 24px, 540px);
      margin: 24px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 2px 16px #cde2ff30;
      padding: 22px 20px 28px;
      min-height: 560px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.5rem;
      border-bottom: 2px solid #e6ecf5;
      padding-bottom: 10px;
      letter-spacing: -1px;
    }

    .nav-bar {
      display: flex;
      gap: 8px;
      margin: 4px 0 24px;
    }

    .nav-btn {
      flex: 1;
      background: #eef5ff;
      color: #2366ea;
      border: 0;
      border-radius: 12px;
      padding: 10px 7px;
      font-weight: 700;
      font-size: .93rem;
      cursor: pointer;
    }

    .nav-btn.active,
    .nav-btn:focus-visible {
      background: #2366ea;
      color: #fff;
    }

    .nav-icon {
      display: inline-block;
      margin-right: 4px;
      font-size: 1.05em;
      vertical-align: -1px;
    }

    label {
      display: block;
      margin: 13px 0 5px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="file"],
    textarea {
      width: 100%;
      font: inherit;
      border: 1.5px solid #bad6ff;
      border-radius: 7px;
      background: #f7fbff;
      padding: 10px;
      outline: none;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #3887e3;
      background: #eef6ff;
    }

    textarea {
      min-height: 72px;
      max-height: 140px;
      resize: vertical;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      font: inherit;
      font-size: 1rem;
      background: #2366ea;
      color: #fff;
      font-weight: 700;
      border: 0;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:hover { background: #1656c7; }
    .btn:disabled { opacity: .6; cursor: wait; }

    .row-btns {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .row-btns button {
      flex: 1;
      margin-top: 0;
    }

    .preview-img {
      display: block;
      width: 160px;
      height: 100px;
      object-fit: cover;
      border: 1px solid #b4cbe8;
      border-radius: 7px;
      margin: 12px auto;
    }

    .img-ph {
      width: 110px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a97b3;
      border: 1.5px dashed #b4cbe8;
      border-radius: 7px;
      background: #f5f8fc;
      text-align: center;
      font-size: .9rem;
    }

    .item-card {
      margin: 12px 0;
      border: 1px solid #d8e5f5;
      border-radius: 10px;
      padding: 13px;
      background: #fbfdff;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .item-card-info {
      min-width: 0;
      flex: 1;
    }

    .item-small {
      font-size: .95rem;
      color: #536580;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .item-small b { color: #334155; }

    .msg {
      background: #f6f8fd;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #dce7f5;
      color: #204083;
      margin: 10px 0 16px;
      font-weight: 500;
      text-align: center;
    }

    .err {
      background: #ffeded;
      color: #a71930;
      border-color: #ffb3b3;
    }

    .success {
      background: #f3fff3;
      color: #287e2d;
      border-color: #97d9a5;
    }

    .notice {
      background: #f1f7ff;
      color: #176bc7;
      padding: 12px;
      border-radius: 6px;
      margin: 18px 0 10px;
      font-size: .95rem;
    }

    .empty {
      color: #64748b;
      text-align: center;
      padding: 16px;
    }

    .small-note {
      color: #64748b;
      font-size: .85rem;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .container {
        width: 100%;
        margin: 0 auto;
        min-height: 100vh;
        border-radius: 0;
        padding: 18px 14px 28px;
      }

      .nav-btn { font-size: .82rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="nav-bar" aria-label="주요 메뉴">
      <button class="nav-btn active" id="nav-register" type="button">
        <span class="nav-icon" aria-hidden="true">📦</span>분실물 등록
      </button>
      <button class="nav-btn" id="nav-search" type="button">
        <span class="nav-icon" aria-hidden="true">🔍</span>분실물 조회
      </button>
      <button class="nav-btn" id="nav-judge" type="button">
        <span class="nav-icon" aria-hidden="true">👤</span>학생 명단 확인
      </button>
    </nav>
    <div id="main-area"></div>
  </main>

  <script>
    "use strict";

    const $main = document.getElementById("main-area");

    // 실제 학생명단.xlsx에 제공된 학생 6명입니다.
    const STUDENTS = [
      { id: "10127", name: "권정민" },
      { id: "10124", name: "임지훈" },
      { id: "10304", name: "김동건" },
      { id: "10323", name: "조영웅" },
      { id: "10101", name: "김효민" },
      { id: "10102", name: "김유빈" }
    ];

    const INITIAL_ITEMS = [
      {
        id: "7f86bba5-ee21-4382-9700-ec5dd6b24f4d",
        registeredAt: "2026-11-13T06:38:39.230Z",
        name: "에어컨리모콘",
        features: "리모콘사용후제자리에라고 써있음",
        place: "4층영어실",
        photoFileId: "1Qu0YNpp74TJHeQb0aFx43ObuIOUnRt6j",
        status: "보관 중"
      },
      {
        id: "556bb8cd-2fe2-44da-9ce7-be91146e3fae",
        registeredAt: "2026-11-13T06:39:18.068Z",
        name: "청소기",
        features: "한쪽 버튼이 잘 안 눌림",
        place: "체육관",
        photoFileId: "1K5PVH30EXp3u0r7PhRuDZmBJhOETvXg6",
        status: "보관 중"
      },
      {
        id: "adcb72b2-3468-461e-bc7a-6e6aa4942e13",
        registeredAt: "2026-11-13T06:49:56.550Z",
        name: "카키색 텀블러",
        features: "이름표 없음 커피 들어 있음",
        place: "1층 운동장",
        photoFileId: "1BrVeHmjH7zMh4HJrkrqnXuUgbBnmiMcS",
        status: "보관 중"
      }
    ];

    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);

    function setActiveTab(index) {
      document.querySelectorAll(".nav-btn").forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });
    }

    function message(element, text, kind = "") {
      element.className = "msg" + (kind ? " " + kind : "");
      element.textContent = text;
    }

    function normalizeItem(raw) {
      if (!raw || typeof raw !== "object") return null;

      return {
        id: String(raw.id ?? raw.postId ?? raw["게시글ID"] ?? ""),
        registeredAt: String(raw.registeredAt ?? raw.createdAt ?? raw["등록일시"] ?? ""),
        name: String(raw.name ?? raw["이름"] ?? ""),
        features: String(raw.features ?? raw["특징"] ?? ""),
        place: String(raw.place ?? raw["발견장소"] ?? ""),
        photoFileId: String(raw.photoFileId ?? raw["사진파일ID"] ?? ""),
        photoUrl: String(raw.photoUrl ?? ""),
        status: String(raw.status ?? raw["상태"] ?? "보관 중")
      };
    }

    function card(rawItem) {
      const item = normalizeItem(rawItem);
      if (!item) return "";

      const photoSrc = item.photoUrl || (item.photoFileId && item.id ? "/api/lost-items?photo=" + encodeURIComponent(item.id) : "");
      return `<article class="item-card">
        ${photoSrc
          ? `<img class="preview-img" src="${esc(photoSrc)}" alt="${esc(item.name)} 사진" onerror="this.replaceWith(document.createTextNode('사진을 불러오지 못했습니다'))">`
          : '<div class="img-ph">사진 없음</div>'}
        <div class="item-card-info">
          <div class="item-small"><b>이름:</b> ${esc(item.name)}</div>
          <div class="item-small"><b>특징:</b> ${esc(item.features)}</div>
          <div class="item-small"><b>발견 장소:</b> ${esc(item.place)}</div>
          <div class="item-small"><b>상태:</b> ${esc(item.status)}</div>
          ${item.registeredAt
            ? `<div class="item-small"><b>등록일:</b> ${esc(item.registeredAt)}</div>`
            : ""}
        </div>
      </article>`;
    }

    async function api(url, body) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);

      try {
        const response = await fetch(url, {
          method: body ? "POST" : "GET",
          ...(body
            ? {
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
              }
            : {}),
          signal: controller.signal
        });

        let data;
        try {
          data = await response.json();
        } catch {
          throw new Error("서버 응답을 읽지 못했습니다. 서버 설정을 확인해 주세요.");
        }

        if (!response.ok || data.ok !== true) {
          throw new Error(data.error || "요청을 처리하지 못했습니다.");
        }

        return data;
      } catch (error) {
        if (error.name === "AbortError") {
          throw new Error("응답 시간이 초과됐습니다. 잠시 후 다시 시도해 주세요.");
        }
        if (error instanceof TypeError) {
          throw new Error("서버에 연결하지 못했습니다. 인터넷 연결과 서버 배포 상태를 확인해 주세요.");
        }
        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    async function preparePhoto(file) {
      const allowedTypes = ["image/jpeg", "image/png", "image/webp", "image/gif"];

      if (!allowedTypes.includes(file.type) || file.size > 20 * 1024 * 1024) {
        throw new Error("20MB 이하의 JPG, PNG, WebP, GIF 사진을 선택해 주세요.");
      }

      const objectUrl = URL.createObjectURL(file);

      try {
        const image = new Image();
        image.src = objectUrl;
        await image.decode();

        if (!image.naturalWidth || image.naturalWidth * image.naturalHeight > 40000000) {
          throw new Error("사진 해상도를 줄여 주세요.");
        }

        const scale = Math.min(1, 1200 / image.naturalWidth, 1200 / image.naturalHeight);
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

        const context = canvas.getContext("2d");
        if (!context) throw new Error("사진을 처리할 수 없습니다.");

        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);

        for (const quality of [0.82, 0.68, 0.5, 0.35]) {
          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          const base64 = dataUrl.slice(dataUrl.indexOf(",") + 1);
          if (base64.length * 3 / 4 <= 500 * 1024) return dataUrl;
        }

        throw new Error("사진 용량을 줄인 후 다시 선택해 주세요.");
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    function showRegister() {
      setActiveTab(0);
      $main.innerHTML = `
        <h1><span aria-hidden="true">📦</span> 분실물 등록하기</h1>
        <form id="form-register" autocomplete="off">
          <fieldset id="register-fields" style="border:0;padding:0;margin:0">
            <label for="fimg">분실물 사진 (선택)</label>
            <input type="file" id="fimg" accept="image/jpeg,image/png,image/webp,image/gif">
            <div class="img-ph" id="preview-ph" style="width:160px;height:100px;margin:12px auto;">
              사진이 첨부되지 않았어요
            </div>

            <label for="fname">분실물 이름</label>
            <input type="text" id="fname" maxlength="20" required placeholder="예) 파란색 볼펜">

            <label for="fplace">발견 장소</label>
            <input type="text" id="fplace" maxlength="25" required placeholder="예) 1층 복도">

            <label for="ffeat">특징</label>
            <textarea id="ffeat" maxlength="40" required placeholder="예) 이름표가 붙어 있음"></textarea>

            <button class="btn" type="submit">게시물 올리기</button>
          </fieldset>
        </form>
        <div id="register-msg" role="status" aria-live="polite"></div>
        <p class="small-note">새 분실물 등록에는 서버의 /api/lost-items 설정이 필요합니다.</p>
      `;

      const form = document.getElementById("form-register");
      const fieldset = document.getElementById("register-fields");
      const button = form.querySelector("button");
      const preview = document.getElementById("preview-ph");
      const msg = document.getElementById("register-msg");

      let photo = "";
      let photoError = false;
      let photoPending = false;
      let generation = 0;
      let requestId = crypto.randomUUID();

      form.addEventListener("input", () => {
        requestId = crypto.randomUUID();
      });

      form.querySelector("#fimg").addEventListener("change", async event => {
        const current = ++generation;
        photo = "";
        photoError = false;
        photoPending = false;
        button.disabled = false;
        preview.className = "img-ph";
        preview.textContent = "사진이 첨부되지 않았어요";

        const file = event.target.files[0];
        if (!file) return;

        photoPending = true;
        button.disabled = true;
        preview.textContent = "사진 준비 중…";

        try {
          const prepared = await preparePhoto(file);
          if (current !== generation || !form.isConnected) return;

          photo = prepared;
          preview.className = "";
          preview.innerHTML = `<img class="preview-img" src="${photo}" alt="첨부 사진 미리보기">`;
          message(msg, "사진을 준비했습니다.");
        } catch (error) {
          if (current !== generation || !form.isConnected) return;

          photoError = true;
          preview.className = "img-ph";
          preview.textContent = "다른 사진을 선택해 주세요";
          message(msg, error.message, "err");
        } finally {
          if (current === generation) {
            photoPending = false;
            button.disabled = false;
          }
        }
      });

      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (fieldset.disabled || photoPending) return;

        if (photoError) {
          message(msg, "사진을 다시 선택하거나 파일 선택을 해제해 주세요.", "err");
          return;
        }

        const body = {
          id: requestId,
          name: form.querySelector("#fname").value.trim(),
          features: form.querySelector("#ffeat").value.trim(),
          place: form.querySelector("#fplace").value.trim(),
          photoDataUrl: photo
        };

        if (!body.name || !body.features || !body.place) {
          message(msg, "분실물 이름, 특징, 발견 장소를 모두 입력해 주세요.", "err");
          return;
        }

        fieldset.disabled = true;
        button.textContent = "등록 중…";
        message(msg, "분실물을 등록하고 있습니다.");

        try {
          const result = await api("/api/lost-items", body);
          if (!form.isConnected) return;

          const item = normalizeItem(result.item);
          if (item) INITIAL_ITEMS.unshift(item);

          message(msg, "분실물이 등록되었습니다.", "success");

          if (item) {
            const resultCard = document.createElement("div");
            resultCard.innerHTML = card(item);
            msg.insertAdjacentElement("afterend", resultCard);
          }

          form.reset();
          photo = "";
          photoError = false;
          requestId = crypto.randomUUID();
          preview.className = "img-ph";
          preview.textContent = "사진이 첨부되지 않았어요";
        } catch (error) {
          if (form.isConnected) message(msg, error.message, "err");
        } finally {
          if (form.isConnected) {
            fieldset.disabled = false;
            button.textContent = "게시물 올리기";
          }
        }
      });
    }

    function getLocalMatches(query) {
      const lowered = query.toLocaleLowerCase("ko");

      return INITIAL_ITEMS
        .map(normalizeItem)
        .filter(item =>
          [item.name, item.features, item.place, item.status]
            .some(value => value.toLocaleLowerCase("ko").includes(lowered))
        );
    }

    function mergeItems(localItems, serverItems) {
      const merged = new Map();

      for (const raw of serverItems) {
        const item = normalizeItem(raw);
        if (item) merged.set(item.id || `server-${merged.size}`, item);
      }

      for (const raw of localItems) {
        const item = normalizeItem(raw);
        if (item && !merged.has(item.id)) merged.set(item.id, item);
      }

      return [...merged.values()];
    }

    function showSearch() {
      setActiveTab(1);
      $main.innerHTML = `
        <h1>분실물 조회하기</h1>
        <form id="form-search" autocomplete="off">
          <label for="search-name">이름, 특징 또는 발견 장소</label>
          <input type="text" id="search-name" maxlength="40" placeholder="예) 텀블러, 체육관, 버튼">
          <button class="btn" type="submit">분실물 조회하기</button>
        </form>
        <div id="search-msg" role="status" aria-live="polite"></div>
        <div id="search-result"></div>
        <div id="search-pages"></div>
        <p class="small-note">제공된 분실물.xlsx 자료 3건은 서버 연결 없이도 검색됩니다. 서버 검색은 /api/lost-items 설정이 필요합니다.</p>
      `;

      const form = document.getElementById("form-search");
      const msg = document.getElementById("search-msg");
      const results = document.getElementById("search-result");
      const pages = document.getElementById("search-pages");
      let generation = 0;

      async function load(query, page) {
        const current = ++generation;
        results.textContent = "";
        pages.textContent = "";

        const localItems = getLocalMatches(query);
        message(msg, "분실물을 불러오고 있습니다.");

        let serverItems = [];
        let serverTotal = 0;
        let serverHasMore = false;
        let serverError = "";

        try {
          const data = await api(
            "/api/lost-items?query=" + encodeURIComponent(query) + "&page=" + page
          );

          if (!form.isConnected || current !== generation) return;
          if (!Array.isArray(data.items)) {
            throw new Error("분실물 목록 응답 형식이 올바르지 않습니다.");
          }

          serverItems = data.items;
          serverTotal = Number(data.total) || serverItems.length;
          serverHasMore = data.hasMore === true;
        } catch (error) {
          serverError = error.message;
        }

        if (!form.isConnected || current !== generation) return;

        const merged = mergeItems(localItems, serverItems);
        const connectionNote = serverError
          ? " 서버 연결 실패: " + serverError + " 로컬 엑셀 자료를 표시합니다."
          : "";

        if (merged.length === 0) {
          message(msg, "검색 결과가 없습니다." + connectionNote, serverError ? "err" : "");
          results.innerHTML = `<div class="empty">검색어를 바꾸어 다시 검색해 보세요.</div>`;
          return;
        }

        const countText = serverError
          ? `엑셀 자료에서 ${merged.length}건을 찾았습니다.`
          : `검색 결과 ${Math.max(serverTotal, merged.length)}건 · ${page}페이지`;

        message(msg, countText + connectionNote, serverError ? "err" : "");

        results.innerHTML = merged.map((item, index) => `
          <div class="search-result-item">
            ${card(item)}
            ${item.status === "보관 중"
              ? `<div class="msg">
                   내가 찾던 물건인가요?
                   <div class="row-btns">
                     <button class="btn" type="button" data-select="${index}">학생 확인</button>
                     <button class="btn" type="button" data-cancel>아니오</button>
                   </div>
                 </div>`
              : ""}
          </div>
        `).join("");

        results.querySelectorAll("[data-select]").forEach(button => {
          button.addEventListener("click", () => {
            showJudge(merged[Number(button.dataset.select)]);
          });
        });

        results.querySelectorAll("[data-cancel]").forEach(button => {
          button.addEventListener("click", () => {
            message(msg, "다른 분실물을 확인해 주세요.");
          });
        });

        if (!serverError) {
          if (page > 1) {
            const previous = document.createElement("button");
            previous.type = "button";
            previous.className = "btn";
            previous.textContent = "이전 페이지";
            previous.addEventListener("click", () => load(query, page - 1));
            pages.append(previous);
          }

          if (serverHasMore) {
            const next = document.createElement("button");
            next.type = "button";
            next.className = "btn";
            next.textContent = "다음 페이지";
            next.addEventListener("click", () => load(query, page + 1));
            pages.append(next);
          }
        }
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const query = form.querySelector("#search-name").value.trim();

        if (!query) {
          generation++;
          results.textContent = "";
          pages.textContent = "";
          message(msg, "검색어를 입력해 주세요.", "err");
          form.querySelector("#search-name").focus();
          return;
        }

        load(query, 1);
      });

      message(msg, "이름, 특징 또는 발견 장소를 입력해 검색해 주세요.");
    }

    function findLocalStudent(id, name) {
      const normalizedId = id.trim();
      const normalizedName = name.trim().normalize("NFC");

      return STUDENTS.some(student =>
        student.id === normalizedId &&
        student.name.normalize("NFC") === normalizedName
      );
    }

    function showJudge(item) {
      setActiveTab(2);
      $main.innerHTML = `
        <h1><span aria-hidden="true">👤</span> 학생 명단 확인하기</h1>
        ${item ? card(item) : ""}
        <form id="form-judge" autocomplete="off">
          <label for="judge-id">학번</label>
          <input type="text" id="judge-id" inputmode="numeric" maxlength="8" required placeholder="학번을 입력하세요">

          <label for="judge-name">이름</label>
          <input type="text" id="judge-name" maxlength="10" required placeholder="이름을 입력하세요">

          <button class="btn" type="submit">명단 확인</button>
        </form>
        <div id="judge-msg" role="status" aria-live="polite"></div>
        <div class="notice">
          입력한 학번과 이름이 학생 명단 DB에 등록되어 있는지 확인합니다.
          분실물의 실제 소유 여부는 교무실에서 확인해 주세요.
        </div>
      `;

      const form = document.getElementById("form-judge");
      const msg = document.getElementById("judge-msg");

      form.addEventListener("submit", async event => {
        event.preventDefault();

        const button = form.querySelector("button");
        const idInput = form.querySelector("#judge-id");
        const nameInput = form.querySelector("#judge-name");

        if (button.disabled) return;

        const id = idInput.value.trim();
        const name = nameInput.value.trim();

        if (!/^\d{1,8}$/.test(id) || !name || name.length > 10) {
          message(msg, "학번과 이름을 확인해 주세요.", "err");
          return;
        }

        button.disabled = true;
        idInput.disabled = true;
        nameInput.disabled = true;
        button.textContent = "확인 중…";
        message(msg, "학생 명단을 확인하고 있습니다.");

        try {
          // 실제 명단 확인은 서버 API에 맡깁니다.
          // API는 전체 명단을 브라우저에 보내지 않고 matched 결과만 반환합니다.
          const result = await api("/api/student-check", { id, name });

          if (!form.isConnected) return;

          if (typeof result.matched !== "boolean") {
            throw new Error("학생 명단 응답 형식이 올바르지 않습니다.");
          }

          message(
            msg,
            result.matched
              ? "학생 명단 확인 완료! 교무실에서 실제 소유 여부를 확인해 주세요."
              : "해당 학번과 이름이 학생 명단에 없습니다.",
            result.matched ? "success" : "err"
          );
        } catch (error) {
          if (!form.isConnected) return;

          // 실제 6명은 로컬에 제공된 엑셀 자료와 비교합니다.
          if (findLocalStudent(id, name)) {
            message(
              msg,
              "제공된 학생명단.xlsx 자료에서 확인했습니다. 교무실에서 실제 소유 여부를 확인해 주세요. 서버 연결은 되지 않았습니다.",
              "success"
            );
          } else {
            message(
              msg,
              error.message || "학생 명단 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.",
              "err"
            );
          }
        } finally {
          if (form.isConnected) {
            button.disabled = false;
            idInput.disabled = false;
            nameInput.disabled = false;
            button.textContent = "명단 확인";
          }
        }
      });
    }

    document.getElementById("nav-register").addEventListener("click", showRegister);
    document.getElementById("nav-search").addEventListener("click", showSearch);
    document.getElementById("nav-judge").addEventListener("click", () => showJudge(null));

    showRegister();
  </script>
</body>
</html>
