<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>분실물 찾기·등록 웹앱</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #f6f9fb;
      font-family: 'Noto Sans KR', sans-serif;
      margin: 0;
      color: #212735;
    }
    .container {
      max-width: 420px;
      margin: 32px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 2px 16px #cde2ff30;
      padding: 30px 18px 24px 18px;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    h1 {
      margin: 0 0 18px 0;
      font-size: 1.5em;
      font-weight: 700;
      border-bottom: 2px solid #e6ecf5;
      padding-bottom: 10px;
      letter-spacing: -1px;
    }
    label {
      margin: 13px 0 5px;
      font-weight: 500;
      display: block;
    }
    input[type="text"], input[type="file"], input[type="number"], textarea {
      width: 100%;
      box-sizing: border-box;
      font-size: 1em;
      border: 1.5px solid #bad6ff;
      border-radius: 7px;
      background: #f7fbff;
      padding: 10px;
      margin-bottom: 2px;
      margin-top: 2px;
      outline: none;
      transition: border .2s;
      resize: none;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #3887e3;
      background: #eef6ff
    }
    textarea {
      min-height: 40px;
      max-height: 100px;
    }
    .btn {
      margin: 18px 0 0 0;
      display: block;
      width: 100%;
      font-size: 1.1em;
      background: #2366ea;
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 12px 0;
      border-radius: 8px;
      box-shadow: 0 1.5px 4px #c5dafb5b;
      cursor: pointer;
      transition: background .2s;
      letter-spacing: .5px;
    }
    .btn:active, .btn:focus { background: #1656c7; }
    .row-btns {
      display: flex;
      gap: 16px;
      justify-content: stretch;
      margin-top: 12px;
    }
    .row-btns button {
      flex: 1 1 0;
    }
    .preview-img {
      display: block;
      width: 140px; height: 85px;
      object-fit: cover;
      border: 1.5px solid #b4cbe8;
      border-radius: 7px;
      background: #f7fafc;
      margin: 10px auto;
    }
    .img-ph {
      width: 140px; height: 85px;
      display:flex;justify-content:center;align-items:center;
      font-size: 1em;color:#8a97b3;
      border: 1.5px dashed #b4cbe8;
      border-radius:7px;
      background: #f5f8fc;
      margin: 14px auto;
      text-align:center;
      letter-spacing:1px;
    }
    .item-list {
      margin: 14px 0 7px 0;
      background: #f7faff;
      border-radius: 10px;
      padding: 9px 11px;
      box-shadow: 0 1px 6px #d5e5fb20;
    }
    .item-card {
      margin: 12px 0 18px 0;
      border:1px solid #d8e8fc;
      border-radius:8px;
      padding:13px 13px 7px;
      background: #fbfdff;
      box-shadow: 0 1px 5px #d5eefa15;
      display: flex;gap:12px;align-items:flex-start;
      flex-wrap: wrap;
    }
    .item-card-info {
      flex: 1 1 0;
    }
    .item-small {
      font-size: 0.98em;
      color: #6c7dae;
      margin-bottom: 7px;
    }
    .step-indicator {
      margin-bottom: 21px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .step-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #e1e9fa;
    }
    .step-dot.active {background:#2366ea;}
    .nav-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
      margin-bottom: 28px;
    }
    .nav-btn {
      background: #eef5ff;
      color: #2366ea;
      border: none;
      border-radius: 14px;
      padding: 8px 19px;
      font-weight: 600;
      margin: 0 2px;
      font-size: 1em;
      transition: background .18s;
      cursor: pointer;
    }
    .nav-btn.active, .nav-btn:focus { background: #2366ea; color: #fff; }
    .notice {
      background: #f1f7ffbe;
      color: #176bc7;
      padding: 12px;
      border-radius: 6px;
      margin: 19px 3px 11px 3px;
      font-size: 1.00em;
      box-shadow: 0 1px 5px #d7ceed13;
    }
    .msg {
      background: #f6f8fd;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #bad7f83b;
      color:#204083;
      margin: 8px auto 16px auto;
      max-width: 300px;
      box-shadow: 0 1px 7px #bfc9f015;
      font-weight: 500;
      font-size: 1.09em;
      text-align:center;
    }
    .err {
      background: #ffeded;
      color: #c81b36;
      border: 1.2px solid #ffb3b3;
    }
    .success {
      background: #f3fff3;
      color: #287e2d;
      border: 1.2px solid #97ffb3;
    }
    @media (max-width:570px) {
      .container {max-width:97vw;}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <button class="nav-btn active" id="nav-register">분실물 등록</button>
      <button class="nav-btn" id="nav-search">분실물 조회</button>
      <button class="nav-btn" id="nav-judge">학생 명단 확인</button>
    </div>
    <div id="main-area"></div>
  </div>

  <script>
const $main=document.getElementById('main-area');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
function setActiveTab(index){document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',i===index));}
function message(el,text,kind=''){el.className='msg '+kind;el.textContent=text;}
function photoUrl(item){return item.photoUrl && UUID.test(item.id)?'/api/lost-items?photo='+encodeURIComponent(item.id):'';}
function card(item){
  const photo=photoUrl(item);
  return `<div class="item-card">
    <div>${photo?`<img src="${photo}" loading="lazy" alt="분실물 사진" style="width:90px;height:60px;object-fit:cover;">`:'<div class="img-ph" style="width:90px;height:60px;">사진 없음</div>'}</div>
    <div class="item-card-info">
      <div class="item-small"><b>이름:</b> ${esc(item.name)}</div>
      <div class="item-small"><b>특징:</b> ${esc(item.features)}</div>
      <div class="item-small"><b>발견 장소:</b> ${esc(item.place)}</div>
      <div class="item-small"><b>상태:</b> ${esc(item.status)}</div>
    </div></div>`;
}
async function api(url,body){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),30000);
  try {
    const response=await fetch(url,{method:body?'POST':'GET',
      ...(body?{headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}),signal:controller.signal});
    let data;
    try {data=await response.json();} catch (_) {throw new Error('서버 연결 설정을 확인해 주세요.');}
    if (!response.ok || data.ok!==true) throw new Error(data.error||'요청을 처리하지 못했습니다.');
    return data;
  } catch (error) {
    if (error.name==='AbortError') throw new Error('응답이 늦어지고 있습니다. 같은 화면에서 다시 눌러 주세요.');
    if (error instanceof TypeError) throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.');
    throw error;
  } finally {clearTimeout(timer);}
}
async function preparePhoto(file){
  if (!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type) || file.size>20*1024*1024) throw new Error('20MB 이하의 JPG, PNG, WebP, GIF 사진을 선택해 주세요.');
  const url=URL.createObjectURL(file);
  try {
    const image=new Image();
    image.src=url;
    await image.decode();
    if (!image.naturalWidth || image.naturalWidth*image.naturalHeight>40000000) throw new Error('사진 해상도를 줄여 주세요.');
    const scale=Math.min(1,1200/image.naturalWidth,1200/image.naturalHeight);
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(image,0,0,canvas.width,canvas.height);
    for (const quality of [0.82,0.68,0.5,0.35]) {
      const result=canvas.toDataURL('image/jpeg',quality);
      if ((result.length-result.indexOf(',')-1)*3/4<=500*1024) return result;
    }
    throw new Error('사진 용량을 줄인 후 다시 선택해 주세요.');
  } finally {URL.revokeObjectURL(url);}
}
function showRegister(){
  setActiveTab(0);
  $main.innerHTML=`<h1>분실물 등록하기</h1>
    <form id="form-register" autocomplete="off"><fieldset style="border:0;padding:0;margin:0">
      <label for="fimg">분실물 사진</label><input type="file" id="fimg" accept="image/jpeg,image/png,image/webp,image/gif">
      <div class="img-ph" id="preview-ph">사진이 첨부되지 않았어요</div>
      <label for="fname">분실물 이름</label><input type="text" id="fname" maxlength="20" required placeholder="예) 파란색 볼펜">
      <label for="fplace">분실물을 찾은 장소</label><input type="text" id="fplace" maxlength="25" required placeholder="예) 1층 복도">
      <label for="ffeat">분실물 특징</label><textarea id="ffeat" maxlength="40" required placeholder="예) 이름표가 붙어 있음"></textarea>
      <button class="btn" type="submit">게시물 올리기</button>
    </fieldset></form><div id="register-msg" role="status"></div>`;
  const form=document.getElementById('form-register');
  const fieldset=form.querySelector('fieldset'), button=form.querySelector('button');
  const preview=document.getElementById('preview-ph'), msg=document.getElementById('register-msg');
  let photo='', photoPending=false, photoError=false, generation=0, requestId=crypto.randomUUID();
  form.addEventListener('input',()=>{requestId=crypto.randomUUID();});
  form.querySelector('#fimg').onchange=async e=>{
    const current=++generation;
    photo='';photoError=false;photoPending=false;button.disabled=false;
    preview.textContent='사진이 첨부되지 않았어요';
    const file=e.target.files[0];
    if (!file) return;
    photoPending=true;button.disabled=true;preview.textContent='사진 준비 중…';
    try {
      const prepared=await preparePhoto(file);
      if (current!==generation || !form.isConnected) return;
      photo=prepared;preview.innerHTML=`<img class="preview-img" src="${photo}" alt="첨부 사진">`;
      message(msg,'사진을 준비했습니다.');
    } catch (error) {
      if (current!==generation || !form.isConnected) return;
      photoError=true;preview.textContent='다른 사진을 선택해 주세요';message(msg,error.message,'err');
    } finally {if(current===generation){photoPending=false;button.disabled=false;}}
  };
  form.onsubmit=async e=>{
    e.preventDefault();
    if (fieldset.disabled || photoPending) return;
    if (photoError){message(msg,'사진을 다시 선택하거나 첨부를 해제해 주세요.','err');return;}
    const body={id:requestId,name:form.querySelector('#fname').value.trim(),
      features:form.querySelector('#ffeat').value.trim(),place:form.querySelector('#fplace').value.trim(),photoDataUrl:photo};
    if (!body.name || !body.features || !body.place){message(msg,'모든 입력란을 채워 주세요.','err');return;}
    fieldset.disabled=true;button.textContent='등록 중…';message(msg,'분실물을 등록하고 있습니다.');
    try {
      const result=await api('/api/lost-items',body);
      if (!form.isConnected) return;
      msg.className='';msg.innerHTML='<div class="msg success">분실물이 등록되었습니다.</div>'+card(result.item)+'<button class="btn" type="button" id="go-search">분실물 조회로 가기</button>';
      msg.querySelector('#go-search').onclick=showSearch;
      form.reset();photo='';photoError=false;requestId=crypto.randomUUID();
      preview.textContent='사진이 첨부되지 않았어요';
    } catch (error) {if(form.isConnected)message(msg,error.message,'err');}
    finally {fieldset.disabled=false;button.textContent='게시물 올리기';}
  };
}
function showSearch(){
  setActiveTab(1);
  $main.innerHTML=`<h1>분실물 조회하기</h1><form id="form-search" autocomplete="off">
    <label for="search-name">찾는 분실물 이름</label>
    <input type="text" id="search-name" maxlength="20" placeholder="예) 볼펜, 교과서">
    <button class="btn" type="submit">분실물 조회하기</button></form>
    <div id="search-msg" role="status"></div><div id="search-result"></div><div id="search-pages"></div>`;
  const form=document.getElementById('form-search'), msg=document.getElementById('search-msg');
  const results=document.getElementById('search-result'), pages=document.getElementById('search-pages');
  let query='',generation=0;
  async function load(page){
    const current=++generation;
    results.textContent='';pages.textContent='';message(msg,'분실물을 불러오고 있습니다.');
    try {
      const data=await api('/api/lost-items?query='+encodeURIComponent(query)+'&page='+page);
      if (!form.isConnected || current!==generation) return;
      message(msg,data.total?`분실물 ${data.total}건 · ${page}페이지`:'분실물을 찾을 수 없습니다.');
      results.innerHTML=data.items.map((item,i)=>card(item)+(item.status==='보관 중'
        ? `<div class="msg">내 분실물이 맞나요?<div class="row-btns"><button class="btn" data-select="${i}" type="button">예</button><button class="btn" data-cancel type="button">아니오</button></div></div>`:'')).join('');
      results.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>showJudge(data.items[Number(b.dataset.select)]));
      results.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>message(msg,'다른 분실물을 확인해 주세요.'));
      for(const [label,target] of [['이전',page>1?page-1:0],['다음',data.hasMore?page+1:0]]){
        if(!target)continue;const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=()=>load(target);pages.append(b);
      }
    } catch(error){if(form.isConnected && current===generation)message(msg,error.message,'err');}
  }
  form.onsubmit=e=>{
    e.preventDefault();
    query=form.querySelector('#search-name').value.trim();
    if(!query){
      generation++;
      results.textContent='';pages.textContent='';
      message(msg,'찾는 분실물 이름을 입력해 주세요.','err');
      form.querySelector('#search-name').focus();
      return;
    }
    load(1);
  };
  message(msg,'찾는 분실물 이름을 입력한 뒤 조회해 주세요.');
}
function showJudge(item){
  setActiveTab(2);
  $main.innerHTML=`<h1>학생 명단 확인</h1>${item?card(item):''}<form id="form-judge" autocomplete="off">
    <label for="judge-id">학번</label><input type="text" id="judge-id" inputmode="numeric" maxlength="8" required placeholder="학번을 입력하세요">
    <label for="judge-name">이름</label><input type="text" id="judge-name" maxlength="10" required placeholder="이름을 입력하세요">
    <button class="btn" type="submit">확인</button></form><div id="judge-msg" role="status"></div>
    <div class="notice">학생 명단과 입력 정보를 확인합니다. 분실물의 실제 주인인지는 교무실에서 확인 후 찾아가세요.</div>`;
  const form=document.getElementById('form-judge'), msg=document.getElementById('judge-msg');
  form.onsubmit=async e=>{
    e.preventDefault();const button=form.querySelector('button');if(button.disabled)return;
    const idInput=form.querySelector('#judge-id'),nameInput=form.querySelector('#judge-name');
    const id=idInput.value.trim(),name=nameInput.value.trim();
    if(!/^\d{1,8}$/.test(id)||!name){message(msg,'학번과 이름을 확인해 주세요.','err');return;}
    button.disabled=idInput.disabled=nameInput.disabled=true;button.textContent='확인 중…';message(msg,'학생 명단을 확인하고 있습니다.');
    try {
      const result=await api('/api/student-check',{id,name});
      if(!form.isConnected)return;
      if(typeof result.matched!=='boolean')throw new Error('명단 응답을 확인하지 못했습니다.');
      message(msg,result.matched?'학생 명단 확인 완료! 교무실에서 실제 소유 확인 후 분실물을 찾아가세요.':'해당 학번과 이름이 학생 명단에 없습니다.',result.matched?'success':'err');
    } catch(error){if(form.isConnected)message(msg,error.message,'err');}
    finally {button.disabled=idInput.disabled=nameInput.disabled=false;button.textContent='확인';}
  };
}
document.getElementById('nav-register').onclick=showRegister;
document.getElementById('nav-search').onclick=showSearch;
document.getElementById('nav-judge').onclick=()=>showJudge(null);
showRegister();

</script>
</body>
</html>
